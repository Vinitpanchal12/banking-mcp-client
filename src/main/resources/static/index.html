<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            max-height: 800px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #1a73e8;
            color: #fff;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: #1a73e8;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: #e8eaf0;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: flex-start;
            background: #fde8e8;
            color: #b91c1c;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            border-top: 1px solid #e0e0e0;
            align-items: flex-end;
        }
        .chat-input-area textarea {
            flex: 1;
            border: 1px solid #d0d0d0;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 42px;
            max-height: 120px;
            line-height: 1.4;
            transition: border-color 0.15s;
        }
        .chat-input-area textarea:focus {
            border-color: #1a73e8;
        }
        .chat-input-area button {
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .chat-input-area button:hover { background: #1557b0; }
        .chat-input-area button:disabled {
            background: #a0c4f1;
            cursor: not-allowed;
        }
        .typing-indicator {
            align-self: flex-start;
            display: none;
            padding: 10px 14px;
            background: #e8eaf0;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            margin: 0 20px;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px; height: 8px;
            background: #666;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }
        @media (max-width: 600px) {
            .chat-container { max-height: none; border-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Banking AI Assistant</div>

        <div class="chat-messages" id="messages">
            <div class="message ai">Hello! How can I help you with your banking needs today?</div>
        </div>

        <div class="typing-indicator" id="typing">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input-area">
            <textarea id="input" rows="1" placeholder="Type your message..." maxlength="2000"></textarea>
            <button id="sendBtn" title="Send">&#10148;</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const messages = document.getElementById('messages');
        const typing = document.getElementById('typing');

        function autoResize() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        }
        input.addEventListener('input', autoResize);

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            input.disabled = loading;
            typing.style.display = loading ? 'flex' : 'none';
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            autoResize();
            setLoading(true);

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err || 'Request failed');
                }
                const data = await res.json();
                addMessage(data.response, 'ai');
            } catch (err) {
                addMessage('Error: ' + err.message, 'error');
            } finally {
                setLoading(false);
                input.focus();
            }
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
        input.focus();
    </script>
</body>
</html>
